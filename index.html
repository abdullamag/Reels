<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Касса-Бар</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Касса-Бар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header + one working area; on phones a bottom tab bar, check slides up as a sheet; on desktop products | receipt column */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#E8ECE7; --ink:#16201A; --muted:#5B6860; --line:#D5DCD4;
  --accent:#1D6A4B; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3; --amber:#A8670C; --amber-soft:#F6EAD6;
  --danger:#B42A22; --danger-soft:#F7E1DE; --ok:#1E7A45; --paper:#FFFEFA; --shadow:0 10px 30px rgba(20,35,27,.14);
  --f1:#2F7D5B; --f2:#B36A12; --f3:#3E64A8; --f4:#A23E62; --f5:#6B5BA8; --f6:#4E7F8C;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161E1A; --surface2:#1F2924; --ink:#E6ECE8; --muted:#93A198; --line:#2A3530;
  --accent:#4DBF8C; --accent-ink:#06130D; --accent-soft:#1B3328; --amber:#E2A33C; --amber-soft:#33281A;
  --danger:#F0736B; --danger-soft:#3A1F1D; --ok:#5BCB8A; --paper:#1A231F; --shadow:0 10px 30px rgba(0,0,0,.45);
  --f1:#5BC08F; --f2:#E2A33C; --f3:#7C9EE0; --f4:#E07A9E; --f5:#A596E6; --f6:#7FB6C4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface2:#1F2924; --ink:#E6ECE8; --muted:#93A198; --line:#2A3530;
  --accent:#4DBF8C; --accent-ink:#06130D; --accent-soft:#1B3328; --amber:#E2A33C; --amber-soft:#33281A;
  --danger:#F0736B; --danger-soft:#3A1F1D; --ok:#5BCB8A; --paper:#1A231F; --shadow:0 10px 30px rgba(0,0,0,.45);
  --f1:#5BC08F; --f2:#E2A33C; --f3:#7C9EE0; --f4:#E07A9E; --f5:#A596E6; --f6:#7FB6C4; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:13px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.open .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}

main{max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.botnav{display:none}
@media (max-width:820px){
  .nav{display:none}
  .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .botnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--muted)}
  .botnav button.on{color:var(--accent)}
  main{padding-bottom:150px}
}

h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.h2{font-weight:800;font-size:17px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
@media (hover:hover){.btn:hover{border-color:var(--muted)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--accent-ink)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.dng.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.big{min-height:56px;font-size:16px;border-radius:14px}
.btn.sm{min-height:34px;padding:0 10px;border-radius:9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.w{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .fd{width:9px;height:9px;border-radius:50%}
.chip.add{border-style:dashed;color:var(--muted)}

input.in,select.in,textarea.in{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;outline:none}
textarea.in{padding:10px 12px;min-height:80px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
@media (max-width:980px){.pos{grid-template-columns:minmax(0,1fr)}.pos>aside{display:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;overflow:hidden}
.tile:active{transform:scale(.98)}
.tile .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.tile b{font-weight:800;font-size:15px;line-height:1.2}
.tile .pr{font-family:var(--mono);font-weight:600;font-size:15px}
.tile .q{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 6px}
.tile .warn{font-size:11px;font-weight:700;color:var(--danger)}
.checks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ck{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;line-height:1.25}
.ck small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.ck b{font-family:var(--mono);font-size:14px}
.ck.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ck.new{border-style:dashed;color:var(--accent);font-weight:800;display:flex;align-items:center}

.receipt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:var(--mono);font-size:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.sheet .receipt{position:static;border:0;padding:0;background:none}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:8px}
.rc-h b{font-family:var(--display);font-size:15px;letter-spacing:.02em}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px dotted var(--line)}
.rl .nm{font-family:var(--body);font-weight:700;font-size:14px;line-height:1.25}
.rl .sum{font-weight:600;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:10px}
.total b{font-size:24px;font-weight:600}
.disc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.disc button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:13px;cursor:pointer}
.disc button.on{background:var(--amber);border-color:var(--amber);color:var(--accent-ink)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;font-family:var(--body)}
.mbar{display:none}
@media (max-width:980px){
  .mbar{display:flex;position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
  .mbar button{pointer-events:auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
  .mbar .mono{font-size:17px}
}
@media (min-width:821px) and (max-width:980px){.mbar{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
@media (hover:hover){.li:hover{background:var(--surface2)}}
.li .t{font-weight:800;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted)}
.li .r{text-align:right;font-variant-numeric:tabular-nums}
.li .r b{font-family:var(--mono);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.amb{background:var(--amber-soft);color:var(--amber)}
.badge.dng{background:var(--danger-soft);color:var(--danger)}
.low{color:var(--danger)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .h2{color:var(--ink);margin-bottom:6px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:20px;margin-top:2px;overflow-wrap:anywhere}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main .lbl{color:inherit;opacity:.8}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.chart{width:100%;height:auto;display:block}

.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.act{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:800;text-align:left;cursor:pointer;min-height:64px}
.act .ic{width:26px;height:26px;color:var(--accent)}
.act small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.act.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.hero .ic{color:var(--accent-ink)}
.act.hero small{color:inherit;opacity:.8}
.act[disabled]{opacity:.5;cursor:not-allowed}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.48)}
.sheet{position:relative;width:min(640px,100%);max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .2s ease-out}
@media (min-width:821px){#sheetWrap{align-items:center}.sheet{border-radius:20px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-body{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sh-foot{border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap}
.sh-foot .btn{flex:1}
.x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:20px;line-height:1}

.dl{display:flex;flex-direction:column;gap:8px}
.dline{display:grid;grid-template-columns:minmax(0,1fr) 92px 110px 36px;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.dline.inv{grid-template-columns:minmax(0,1fr) 80px 92px 36px}
.dline.q2{grid-template-columns:minmax(0,1fr) 110px 36px}
@media (max-width:520px){
  .dline,.dline.inv{grid-template-columns:1fr 1fr 36px}
  .dline .nmf,.dline.inv .nmf{grid-column:1/-1}
  .dline.q2{grid-template-columns:1fr 110px 36px}
  .dline.q2 .nmf{grid-column:auto}
}
.dline .in{min-height:40px;background:var(--surface)}
.dline .hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.xb{width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font-size:18px}
.note{border-radius:12px;padding:10px 12px;background:var(--amber-soft);color:var(--ink);font-size:14px}
.note.ok{background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-weight:600}
.kv .sep{grid-column:1/-1;border-top:1px dashed var(--line);margin:4px 0}
.photo-prev{max-height:220px;border-radius:12px;border:1px solid var(--line);object-fit:contain;align-self:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:981px){#toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.colors{display:flex;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink)}
.foot-note{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
.lock{max-width:380px;margin:20px auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock .card{width:100%;text-align:left}
.dots{display:flex;gap:16px;margin:4px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:26px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--accent-soft)}
.pad .blank{visibility:hidden}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tt{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer}
.tt b{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.2}
.tt.busy{background:var(--accent-soft);border-color:var(--accent)}
.tt .sum{font-family:var(--mono);font-weight:600;font-size:18px}
.tt small{color:var(--muted);font-weight:600;font-size:12px}
.tt.quick{border-style:dashed;color:var(--accent)}
.user{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.user .ic{width:16px;height:16px}
@media (max-width:520px){.logo span{display:none}.pill{padding:6px 10px}}
.backrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
.switch b{display:block}.switch small{color:var(--muted);font-size:13px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(20px)}
.fhint{font-size:12px;color:var(--muted);line-height:1.35}
html,body,button,input,select,textarea,label,a,[data-a]{touch-action:manipulation}
button,[data-a]{-webkit-user-select:none;user-select:none}
.btn,.chip,.tile,.tt,.li,.ck,.act,.qty button,.disc button,.pad button,.x,.xb,.seg button,.nav button,.botnav button,.pill,.user,.mbar button{transition:transform .06s ease-out,background-color .06s}
.btn:active,.chip:active,.act:active,.ck:active,.x:active,.xb:active,.qty button:active,.disc button:active,.pill:active,.user:active,.mbar button:active{transform:scale(.96)}
.tile:active,.tt:active{transform:scale(.97);background:var(--accent-soft)}
.li:active{background:var(--surface2)}
.botnav button:active,.nav button:active,.seg button:active{background:var(--surface2)}
.btn.pri:active{filter:brightness(1.1)}
.role{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--amber)}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const P=s=>{const n=parseFloat(String(s??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100, r3=n=>Math.round((+n||0)*1000)/1000, r4=n=>Math.round((+n||0)*10000)/10000;
const money=n=>r2(n).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const rub=n=>Math.round(+n||0).toLocaleString('ru-RU')+' ₽';
const num=n=>r3(n).toLocaleString('ru-RU',{maximumFractionDigits:3});
const pct=n=>isFinite(n)?Math.round(n)+'%':'—';
const clean=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const tm=ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const dtm=ts=>new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dfmt=k=>{if(!k)return'';const[y,m,d]=k.split('-');return d+'.'+m+'.'+y};
const toLocalInput=ts=>{const d=new Date(ts);return dayKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fromLocalInput=s=>{const t=new Date(s).getTime();return isFinite(t)?t:null};
const hrs=ms=>Math.round(ms/36e5*100)/100;
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин'};
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const monTitle=k=>{const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y};
const monShift=(k,d)=>{const[y,m]=k.split('-').map(Number);return monKey(new Date(y,m-1+d,1))};
const UNITS=['шт','мл','л','г','кг','порц','бут','уп'];
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}};
async function hash(pin,salt){const d=new TextEncoder().encode(salt+':'+pin);
  try{if(crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch{}
  let x=7;for(const c of d)x=(x*31+c)|0;return 'w'+x}

const ICON={
 pos:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 8h4M7 11h7"/>',
 stock:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
 docs:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 menu:'<path d="M5 3v8a3 3 0 0 0 3 3v7M8 3v6M11 3v8a3 3 0 0 1-3 3M17 21V3c-2 1-3 4-3 8h3"/>',
 rep:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
 team:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3 3 0 0 1 0 6M18 14c2 .7 3 2.6 3 6"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 inv:'<path d="M9 4h6M5 7h14v13H5z"/><path d="M9 12l2 2 4-4"/>',
 req:'<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>',
 off:'<path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 hand:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const TABS=[['pos','Касса',0],['stock','Склад',0],['docs','Документы',0],['menu','Меню',1],['rep','Отчёты',1],['team','Управление',1]];
const DT={invoice:'Накладная',request:'Заявка',writeoff:'Списание',inventory:'Инвентаризация'};
const LOGT={del:'Удаление позиции',delCheck:'Удаление чека',disc:'Скидка',refund:'Возврат',in:'Внесение',out:'Изъятие',open:'Открытие смены',close:'Закрытие смены',writeoff:'Списание',invoice:'Накладная',inventory:'Инвентаризация',join:'Начало работы',leave:'Конец работы'};
const PAYT={shift:'за смену',hour:'в час',month:'в месяц'};

/* ---------- state ---------- */
const S={tab:lsGet('kb_tab')||'pos',ready:false,mode:'',folders:{},items:{},menu:{},shifts:{},docs:{},orders:{},staff:{},tables:{},timesheet:{},archive:{},
  me:lsGet('kb_me'),pin:'',pinErr:false,setup:{name:'',pin:'',pin2:''},
  cur:null,pend:null,posF:'all',posQ:'',stF:'all',stQ:'',mnF:'all',docF:'all',sheet:null,edit:null,armed:null,openCash:'',
  rep:{mode:'day',day:dayKey(),month:monKey()},team:{sec:'staff',month:monKey(),jf:'all'},oc:{}};
let DB=null,SAMPLE=null,SLIM=null;

const me=()=>{const m=S.staff[S.me];return m&&m.active!==false?m:null};
const isAdmin=()=>{const m=me();return !!m&&m.role==='admin'};
const tabs=()=>TABS.filter(t=>!t[2]||isAdmin());
const sname=id=>(S.staff[id]&&S.staff[id].name)||'—';

/* ---------- storage ---------- */
const COLS=['folders','items','menu','shifts','docs','staff','tables','timesheet'];
const wq={};
function saveLocal(){const o={};for(const c of [...COLS,'orders','archive'])o[c]=S[c];lsSet('kassabar_v2',JSON.stringify(o))}
function loadLocal(){try{const d=JSON.parse(lsGet('kassabar_v2')||lsGet('kassabar_v1')||'{}');for(const c of [...COLS,'orders','archive'])S[c]=d[c]||{}}catch{}}
function put(c,o){o=clean(o);S[c][o.id]=o;
  if(DB){const k=c+'/'+o.id;wq[k]=(wq[k]||Promise.resolve()).then(()=>DB.collection(c).doc(o.id).set(o)).catch(dbErr);return wq[k]}
  saveLocal();return Promise.resolve()}
function del(c,id){delete S[c][id];
  if(DB){const k=c+'/'+id;wq[k]=(wq[k]||Promise.resolve()).then(()=>DB.collection(c).doc(id).delete()).catch(dbErr);return wq[k]}
  saveLocal();return Promise.resolve()}
function dbErr(e){const c=e&&e.code;toast(c==='quota_exceeded'?'База заполнена: удалите старые документы':c==='permission_denied'||c==='not_granted'?'Нет прав на запись — попросите владельца дать доступ':'Не удалось сохранить, проверьте связь')}

const loaded=new Set();let ordUnsub=null,ordShift='-';
function markLoaded(c){loaded.add(c);if(loaded.size>=COLS.length&&!S.ready){S.ready=true}}
function snapTo(c){return snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=clean(d.data())});S[c]=o;markLoaded(c);if(c==='shifts')syncOrders();render()}}
function subErr(c){return e=>{dbErr(e);markLoaded(c);render()}}
function subscribe(){
  for(const c of ['folders','items','menu','staff','tables'])DB.collection(c).onSnapshot(snapTo(c),subErr(c));
  DB.collection('shifts').orderBy('openedAt','desc').limit(400).onSnapshot(snapTo('shifts'),subErr('shifts'));
  DB.collection('docs').orderBy('ts','desc').limit(400).onSnapshot(snapTo('docs'),subErr('docs'));
  DB.collection('timesheet').orderBy('in','desc').limit(1000).onSnapshot(snapTo('timesheet'),subErr('timesheet'));
}
function syncOrders(){const sh=curShift();const id=sh?sh.id:null;if(id===ordShift)return;ordShift=id;
  if(!DB)return;if(ordUnsub){ordUnsub();ordUnsub=null}S.orders={};
  if(id)ordUnsub=DB.collection('orders').where('shiftId','==',id).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=clean(d.data())});S.orders=o;render()},dbErr)}

/* ---------- domain ---------- */
const curShift=()=>Object.values(S.shifts).find(s=>s.status==='open')||null;
const folders=k=>Object.values(S.folders).filter(f=>f.kind===k).sort((a,b)=>(a.ord||0)-(b.ord||0)||a.name.localeCompare(b.name,'ru'));
const fcol=id=>{const f=S.folders[id];return f?`var(--f${f.color||1})`:'var(--line)'};
const fname=id=>S.folders[id]?S.folders[id].name:'Без папки';
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'ru');
const itemCost=id=>{const it=S.items[id];return it?(+it.cost||0):0};
const gross=(id,q)=>{const it=S.items[id];const w=it?Math.min(Math.max(+it.waste||0,0),90):0;return P(q)/(1-w/100)};
const menuCost=rec=>(rec||[]).reduce((s,r)=>s+itemCost(r.itemId)*gross(r.itemId,r.qty),0);
const shiftOrders=sh=>Object.values(S.orders).filter(o=>o.shiftId===sh.id);
const lineSum=o=>o.lines.reduce((s,l)=>s+l.price*l.qty,0);
const orderTotal=o=>Math.round(lineSum(o)*(1-(o.disc||0)/100));
const tableName=o=>o.tableId?(S.tables[o.tableId]?S.tables[o.tableId].name:'Стол'):'Быстрый чек';
const tablesSorted=()=>Object.values(S.tables).sort((a,b)=>(a.ord||0)-(b.ord||0)||String(a.name).localeCompare(String(b.name),'ru',{numeric:true}));
function avail(m){const rec=m.recipe||[];if(!rec.length)return Infinity;let a=Infinity;for(const r of rec){const it=S.items[r.itemId];const g=gross(r.itemId,r.qty);if(!it||!g)continue;a=Math.min(a,Math.floor((+it.qty||0)/g))}return a}
function moveStock(map,sign){for(const [id,q] of Object.entries(map)){const it=S.items[id];if(!it)continue;it.qty=r3((+it.qty||0)+sign*q);put('items',it)}}
function recipeMap(lines){const m={};for(const l of lines)for(const r of (l.recipe||[]))m[r.itemId]=(m[r.itemId]||0)+P(r.qty)*l.qty;return m}
function matchItem(name){const n=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();const q=n(name);if(!q)return null;
  const its=Object.values(S.items);let f=its.find(i=>n(i.name)===q);if(f)return f.id;
  f=its.find(i=>{const x=n(i.name);return x.length>3&&(q.includes(x)||x.includes(q))});return f?f.id:null}
const myEntry=sh=>Object.values(S.timesheet).find(t=>t.shiftId===sh.id&&t.staffId===S.me&&!t.out);
const shiftCrew=sh=>Object.values(S.timesheet).filter(t=>t.shiftId===sh.id).sort((a,b)=>a.in-b.in);
function logEv(t,text,sum,shId){const sh=shId?S.shifts[shId]:curShift();if(!sh)return;sh.log=[...(sh.log||[]),{ts:Date.now(),by:S.me,t,text,sum:r2(sum||0)}].slice(-1500);put('shifts',sh)}

/* ---------- DOM patching (keeps focus and keyboard open) ---------- */
function morph(el,html){const t=document.createElement('template');t.innerHTML=html;patchKids(el,t.content)}
function patchKids(f,t){const fc=[...f.childNodes],tc=[...t.childNodes];
  for(let i=0;i<tc.length;i++){const a=fc[i],b=tc[i];
    if(!a){f.appendChild(b);continue}
    if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName||(a.nodeType===1&&a.id!==b.id)){f.replaceChild(b,a);continue}
    if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;continue}
    patchEl(a,b)}
  for(let i=fc.length-1;i>=tc.length;i--)fc[i].remove()}
function patchEl(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  const tag=a.tagName,act=a===document.activeElement;
  if(tag==='INPUT'){if(a.type==='checkbox'){a.checked=b.hasAttribute('checked');return}if(!act){const v=b.getAttribute('value')||'';if(a.value!==v)a.value=v}return}
  if(tag==='TEXTAREA'){if(!act&&a.value!==b.textContent)a.value=b.textContent;return}
  if(tag==='SELECT'){const o=b.querySelector('option[selected]');const v=o?(o.hasAttribute('value')?o.getAttribute('value'):o.textContent):null;patchKids(a,b);if(!act){if(v!=null)a.value=v;else a.selectedIndex=0}return}
  patchKids(a,b)}

/* ---------- render ---------- */
let rq=0;function render(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;doRender()})}
let sq=0;function queueSheet(){if(!sq&&!rq)sq=requestAnimationFrame(()=>{sq=0;renderSheet()})}
function doRender(){
  if(sq){cancelAnimationFrame(sq);sq=0}
  const m=me(),locked=S.ready&&!m,tb=tabs();
  if(!tb.some(t=>t[0]===S.tab))S.tab='pos';
  const nav=(!S.ready||locked)?'':tb.map(([k,n])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${ic(k)}<span>${n}</span></button>`).join('');
  morph($('#nav'),nav);morph($('#botnav'),nav);$('#botnav').style.gridTemplateColumns=`repeat(${tb.length},1fr)`;$('#botnav').hidden=!nav;
  const sh=curShift(),pill=$('#shiftPill');pill.hidden=!m;pill.className='pill'+(sh?' open':'');
  pill.innerHTML=sh?`<span class="dot"></span>Смена №${sh.num} · ${tm(sh.openedAt)}`:`<span class="dot"></span>Смена закрыта`;
  const uc=$('#userChip');uc.hidden=!m;if(m)uc.innerHTML=`${ic('lock')}${esc(m.name)}`;
  morph($('#view'),!S.ready?`<div class="empty"><div class="row" style="justify-content:center"><span class="spin"></span>Загружаю данные бара…</div></div>`:locked?lockHTML():VIEW[S.tab]());
  renderMbar();renderSheet();
}

/* ===== login ===== */
function lockHTML(){
  const hasAdmin=Object.values(S.staff).some(s=>s.role==='admin'&&s.active!==false);
  if(!hasAdmin){const e=S.setup;return `<div class="lock"><div class="h1">Добро пожаловать</div>
    <p class="muted" style="margin:0">Создайте аккаунт управляющего. Он добавит сотрудников, столы, товары и тех. карты.</p>
    <div class="card stack"><label class="fld"><span>Имя управляющего</span><input class="in" id="su_name" data-s="name" value="${esc(e.name)}" placeholder="Например, Анна"></label>
    <div class="grid2"><label class="fld"><span>PIN, 4 цифры</span><input class="in mono" id="su_pin" data-s="pin" inputmode="numeric" maxlength="4" type="password" value="${esc(e.pin)}"></label>
    <label class="fld"><span>Ещё раз</span><input class="in mono" id="su_pin2" data-s="pin2" inputmode="numeric" maxlength="4" type="password" value="${esc(e.pin2)}"></label></div>
    <button class="btn pri big" data-a="setupAdmin">Создать и войти</button></div>
    <p class="muted" style="font-size:13px;margin:0">Запомните PIN: восстановить его нельзя. Позже можно добавить второго управляющего на всякий случай.</p></div>`}
  const n=S.pin.length;
  return `<div class="lock"><div class="h1">Вход</div><p class="muted" style="margin:0">Введите свой PIN-код</p>
   <div class="dots ${S.pinErr?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>
   <div style="min-height:20px" class="low">${S.pinErr?'Неверный PIN':''}</div>
   <div class="pad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button data-a="pin" data-v="${k}" aria-label="${k==='⌫'?'Стереть':k}">${k}</button>`:'<span class="blank"></span>').join('')}</div></div>`}
async function tryLogin(){if(S.pin.length<4)return;const pin=S.pin;
  for(const s of Object.values(S.staff)){if(s.active===false)continue;if(await hash(pin,s.salt)===s.hash){S.me=s.id;lsSet('kb_me',s.id);S.pin='';S.pinErr=false;S.cur=null;S.pend=null;toast(`Здравствуйте, ${s.name}`);render();return}}
  S.pinErr=true;S.pin='';render();setTimeout(()=>{S.pinErr=false;render()},1400)}
async function pinTaken(pin,exceptId){for(const s of Object.values(S.staff)){if(s.id===exceptId||s.active===false)continue;if(await hash(pin,s.salt)===s.hash)return true}return false}

/* ===== POS ===== */
function viewPOS(){
  const sh=curShift();
  if(!sh)return `<div class="card stack" style="max-width:460px;margin:24px auto">
    <div class="h1">Откройте смену</div>
    <p class="muted" style="margin:0">Смену откроет <b>${esc(me().name)}</b>, время начала работы запишется в табель. Укажите, сколько наличных в кассе.</p>
    <label class="fld"><span>Наличные в кассе на начало, ₽</span><input class="in mono" id="o_cash" inputmode="decimal" placeholder="0" value="${esc(S.openCash)}" data-g="openCash"></label>
    <button class="btn pri big" data-a="openShift">Открыть смену</button>
    ${Object.keys(S.menu).length||!isAdmin()?'':`<div class="note">В меню пока нет позиций. Добавьте их во вкладке «Меню» или <button class="btn sm" data-a="demo">заполните примером бара</button></div>`}
  </div>`;
  if(!myEntry(sh)){const legacy=!S.staff[sh.openedBy];const opens=shiftOrders(sh).filter(o=>o.status==='open'&&o.lines.length).length;
    return `<div class="card stack" style="max-width:480px;margin:24px auto">
    <div class="h1">Смена №${sh.num} уже открыта</div>

function stats(orders){const s={rev:0,cash:0,card:0,checks:0,cost:0,disc:0,refund:0,refundN:0,items:{},days:{},folders:{},staff:{}};
  for(const o of orders){if(o.status==='refund'){s.refund+=o.total||0;s.refundN++;continue}if(o.status!=='paid')continue;
    s.rev+=o.total;s[o.pay==='card'?'card':'cash']+=o.total;s.checks++;s.cost+=o.cost||0;s.disc+=o.discSum||0;
    const d=s.days[o.day]||(s.days[o.day]={rev:0,cost:0,n:0});d.rev+=o.total;d.cost+=o.cost||0;d.n++;
    const st=s.staff[o.by||'']||(s.staff[o.by||'']={rev:0,n:0});st.rev+=o.total;st.n++;
    const k=1-(o.disc||0)/100;
    for(const l of o.lines){const key=l.menuId||l.name;const it=s.items[key]||(s.items[key]={name:l.name,qty:0,rev:0,cost:0});it.qty+=l.qty;it.rev+=l.price*l.qty*k;it.cost+=(l.cost||0)*l.qty;
      const fk=l.folderId||'';const f=s.folders[fk]||(s.folders[fk]={rev:0,cost:0});f.rev+=l.price*l.qty*k;f.cost+=(l.cost||0)*l.qty}}
  return s}
function shiftStats(sh,orders){const st=stats(orders);const ops=sh.cashOps||[];
  const cin=ops.filter(x=>x.t==='in').reduce((s,x)=>s+x.sum,0),cout=ops.filter(x=>x.t==='out').reduce((s,x)=>s+x.sum,0);
  st.cashIn=cin;st.cashOut=cout;st.expected=r2((+sh.openCash||0)+st.cash+cin-cout);return st}
function openShift(){if(curShift())return;const nums=Object.values(S.shifts).map(s=>s.num||0);const now=Date.now();
  const sh={id:uid(),num:(nums.length?Math.max(...nums):0)+1,status:'open',openedAt:now,day:dayKey(),openedBy:S.me,openCash:P(S.openCash),cashOps:[],log:[{ts:now,by:S.me,t:'open',text:`Смена открыта, в кассе ${rub(P(S.openCash))}`,sum:0}]};

async function closeShift(){const sh=curShift();if(!sh)return;const os=shiftOrders(sh);
  if(os.some(o=>o.status==='open'&&o.lines.length)){toast('Есть открытые чеки — оплатите или удалите их');return}
  os.filter(o=>o.status==='open').forEach(o=>del('orders',o.id));

async function archiveShift(sh,list){if(!list.length)return;const W=[];

  else if(d.type==='writeoff'){for(const l of d.lines){const it=S.items[l.itemId];l.cost=+it.cost||0;it.qty=r3((+it.qty||0)-P(l.qty));put('items',it)}}

async function shrink(file){try{const url=URL.createObjectURL(file);const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
  const k=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return b||file}catch{return file}}
let ocrCtl=null;
async function recognize(file){
  if(!SAMPLE){toast('Распознавание доступно, когда приложение открыто в Claude');return}
  const blob=await shrink(file);const prev=URL.createObjectURL(blob);
  openSheet({t:'ocr',status:'work',prev},null);
  const cat=Object.values(S.items).sort(byName).slice(0,500).map(i=>`${i.id} | ${i.name} | ${i.unit}`).join('\n')||'(справочник пуст)';
  const prompt=`Ты помогаешь бару вести склад. На фото товарная накладная поставщика (ТОРГ-12, УПД, счёт-фактура или товарный чек). Извлеки из неё товарные строки.

Справочник товаров склада (id | название | единица учёта):
${cat}

Верни ТОЛЬКО JSON такого вида, без пояснений:
{"supplier":"название поставщика","number":"номер документа","date":"YYYY-MM-DD","lines":[{"raw":"наименование как в накладной","name":"короткое понятное название товара","itemId":"id из справочника или null","unit":"единица учёта","qty":0,"sum":0}]}

Правила:
